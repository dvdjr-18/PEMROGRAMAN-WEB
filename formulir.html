<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pemesanan - RentalKu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">RentalKu</div>
  </header>

  <nav>
    <a href="beranda.html">Beranda</a>
    <a href="katalog.html">Katalog Kendaraan</a>
    <a href="syarat.html">Syarat Ketentuan</a>
    <a href="formulir.html" class="active btn-pesan-nav">Pesan Sekarang</a>
  </nav>

  <main class="grid-container">
    <section class="kartu">
      <h2>Formulir Pemesanan Kendaraan</h2>
      
      <form id="form-pesanan">
        <fieldset>
          <legend>1. Data Diri Penyewa</legend>
          
          <div class="grup-input">
            <label for="nama">Nama Lengkap Sesuai KTP:</label>
            <input type="text" id="nama" name="nama" required>
          </div>

          <div class="form-row">
            <div class="grup-input">
              <label for="wa">Nomor WhatsApp:</label>
              <input type="tel" id="wa" name="wa" required>
            </div>
            <div class="grup-input">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required>
            </div>
          </div>

          <div class="grup-input">
            <label for="alamat">Alamat Domisili:</label>
            <textarea id="alamat" name="alamat" rows="3" required></textarea>
          </div>

          <div class="grup-input">
            <label for="ktp">Unggah KTP:</label>
            <input type="file" id="ktp" name="ktp" accept="image/*" required>
          </div>
        </fieldset>

        <fieldset>
          <legend>2. Detail Kendaraan &amp; Jadwal</legend>
          
          <div class="form-row">
            <div class="grup-input">
              <label for="pilih-kendaraan">Pilih Kendaraan:</label>
              <select id="pilih-kendaraan" name="kendaraan" required>
                <option value="">-- Pilih Kendaraan --</option>
                <option value="300000">Toyota Avanza (Rp 300.000/hari)</option>
                <option value="250000">Honda Brio (Rp 250.000/hari)</option>
                <option value="120000">Yamaha NMAX (Rp 120.000/hari)</option>
                <option value="80000">Honda Beat (Rp 80.000/hari)</option>
              </select>
            </div>

            <div class="grup-input">
              <label for="lama-sewa">Lama Sewa (Hari):</label>
              <input type="number" id="lama-sewa" name="lamaSewa" min="1" value="1" required>
            </div>
          </div>

          <div class="grup-input">
            <label>
              <input type="checkbox" id="cek-helm" value="20000"> Sewa 1 Helm (Rp 20.000)
            </label>
            <label>
              <input type="checkbox" id="cek-supir" value="150000"> Gunakan Jasa Supir (Rp 150.000/hari)
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>3. Pembayaran</legend>
          
          <div class="total-box">
            <h3>Total Biaya Sewa</h3>
            <span id="total-biaya">Rp 0</span>
          </div>

          <div class="grup-input">
            <label for="metode">Metode Pembayaran:</label>
            <select id="metode" name="metode" required>
              <option value="">-- Pilih Metode --</option>
              <option value="transfer">Transfer Bank (BCA / Mandiri / BNI)</option>
              <option value="ewallet">E-Wallet (GoPay / OVO / Dana)</option>
            </select>
          </div>

          <div>
            <button type="submit" class="btn-primary">Bayar Sekarang</button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
